    <!-- SANTÉ ANIMALE in clean tracked sans-serif -->
    <text x="0" y="44" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="4.5">SANTÉ ANIMALE</text>
  </g>
