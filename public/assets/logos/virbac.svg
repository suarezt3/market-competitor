<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="100%">
  <rect width="340" height="220" rx="24" fill="#1B54A9"/>
  
  <g transform="translate(170, 95)">
    <!-- Virbac custom logotype -->
    <text x="0" y="0" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="900" font-style="italic" font-size="58" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
      V<tspan fill="#FFFFFF">ı</tspan>rbac
    </text>
    <!-- Red square dot on the i -->
    <rect x="-47" y="-54" width="12" height="11" fill="#E5242A" transform="rotate(-6 -41 -49)"/>

    <!-- Red horizontal divider line with subtle taper -->
