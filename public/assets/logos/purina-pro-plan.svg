<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="100%">
  <rect width="340" height="220" rx="24" fill="#0A0A0A"/>
  
  <!-- Golden Roof Arch -->
  <path d="M 45 92 L 170 52 L 295 92" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 52 92 L 170 54 L 288 92" fill="none" stroke="#F3E5AB" stroke-width="1.2" opacity="0.8"/>

  <!-- Purina checkerboard + text -->
  <g transform="translate(100, 105)">
    <!-- Checkerboard (3x3 squares) -->
    <rect x="-24" y="-12" width="8" height="8" fill="#E2001A"/>
    <rect x="-16" y="-12" width="8" height="8" fill="#FFFFFF"/>
    <rect x="-8" y="-12" width="8" height="8" fill="#E2001A"/>
    <rect x="-24" y="-4" width="8" height="8" fill="#FFFFFF"/>
    <rect x="-16" y="-4" width="8" height="8" fill="#E2001A"/>
    <rect x="-8" y="-4" width="8" height="8" fill="#FFFFFF"/>
    <rect x="-24" y="4" width="8" height="8" fill="#E2001A"/>
    <rect x="-16" y="4" width="8" height="8" fill="#FFFFFF"/>
    <rect x="-8" y="4" width="8" height="8" fill="#E2001A"/>

    <!-- PURINA box -->
    <rect x="2" y="-13" width="138" height="27" rx="3" fill="#FFFFFF"/>
    <text x="71" y="7" font-family="'Arial Black', sans-serif" font-weight="900" font-size="19" fill="#0A0A0A" text-anchor="middle" letter-spacing="1.5">PURINA</text>
    <text x="134" y="-3" font-family="sans-serif" font-size="7" fill="#0A0A0A">®</text>
  </g>

  <!-- PRO PLAN in gold serif -->
  <text x="170" y="168" font-family="'Cinzel', 'Times New Roman', serif" font-weight="800" font-size="34" fill="#D4AF37" text-anchor="middle" letter-spacing="3.5">PRO PLAN</text>
  <text x="272" y="148" font-family="sans-serif" font-size="9" fill="#D4AF37">®</text>
</svg>
