<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <rect width="320" height="240" rx="28" fill="#FFFFFF"/>
  <g transform="translate(160, 85)">
    <defs>
      <clipPath id="h-left-clip">
        <rect x="-65" y="-55" width="55" height="110"/>
      </clipPath>
      <clipPath id="h-right-clip">
        <rect x="10" y="-55" width="55" height="110"/>
      </clipPath>
    </defs>
    
    <!-- Top red blocks -->
    <rect x="-65" y="-55" width="55" height="52" rx="4" fill="#E31837"/>
    <rect x="10" y="-55" width="55" height="52" rx="4" fill="#E31837"/>
    <!-- Bottom blue blocks -->
    <rect x="-65" y="3" width="55" height="52" rx="4" fill="#003366"/>
    <rect x="10" y="3" width="55" height="52" rx="4" fill="#003366"/>

    <!-- Dynamic white swoosh cutting across -->
    <path d="M -90 40 Q -10 -25 90 -45 Q 30 -10 -70 48 Z" fill="#E31837"/>
    <path d="M -95 48 Q -10 -15 95 -38 Q 20 -5 -75 56 Z" fill="#FFFFFF"/>
    <path d="M -100 56 Q -10 -5 100 -30 Q 10 2 -80 64 Z" fill="#003366"/>
  </g>
  <!-- Hill's typography with classic serif feel -->
  <text x="160" y="200" font-family="'Times New Roman', 'Georgia', serif" font-weight="900" font-size="46" fill="#0A0A0A" text-anchor="middle" letter-spacing="-0.5">Hill’s</text>
</svg>
